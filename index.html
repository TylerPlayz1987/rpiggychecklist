<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piggy Collectibles Checklist</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <div class="app-header">
      <h1>Piggy Collectibles Checklist</h1>
      <div class="total-progress-block">
        <div class="total-progress" aria-label="Total collectibles progress">
          <span class="total-progress-label">Total Collectibles</span>
          <progress id="total-progress-bar" value="0" max="1"></progress>
          <span id="total-progress-count">0/0</span>
        </div>
        <div class="legend" aria-label="Highlight legend">
          <span class="legend-title">Legend:</span>
          <ul class="legend-list">
            <li class="legend-item legend-item-green">Becoming unobtainable</li>
            <li class="legend-item legend-item-red">Unobtainable</li>
          </ul>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        <button id="update-log-button" class="update-log-button" type="button">Update Log</button>
        <a class="report-bug-button" href="https://forms.gle/QNgtKmZiqD94rBR18"
          target="_blank" rel="noopener noreferrer">Report Bug</a>
      </div>
    </div>

    <div class="controls">
      <button id="export-button" type="button">Export Progress</button>
      <label class="import-label" for="import-input">Import Progress</label>
      <input id="import-input" type="file" accept="application/json" />
    </div>

    <div class="tabs" role="tablist" aria-label="Collectible categories">
      <button class="tab-button active" role="tab" aria-selected="true" data-tab="skins">Skins</button>
      <button class="tab-button" role="tab" aria-selected="false" data-tab="items">Items</button>
      <button class="tab-button" role="tab" aria-selected="false" data-tab="effects">Effects</button>
      <button class="tab-button" role="tab" aria-selected="false" data-tab="build-mode">Build Mode</button>
    </div>

    <section id="skins" class="tab-panel active" role="tabpanel" data-type>
      <h2 data-title="Skins">Skins</h2>
    </section>

    <section id="items" class="tab-panel" role="tabpanel" hidden data-type>
      <h2 data-title="Items">Items</h2>
    </section>

    <section id="effects" class="tab-panel" role="tabpanel" hidden data-type>
      <h2 data-title="Effects">Effects</h2>
    </section>

    <section id="build-mode" class="tab-panel" role="tabpanel" hidden data-type>
      <h2 data-title="Build Mode">Build Mode</h2>
    </section>
  </main>

  <dialog id="update-log-dialog" class="update-log-dialog" aria-labelledby="update-log-title">
    <div class="update-log-header">
      <div>
        <h2 id="update-log-title">Update Log</h2>
        <p class="app-version">Version 0.1.0</p>
      </div>
      <button id="close-update-log" class="dialog-close" type="button" aria-label="Close update log">&times;</button>
    </div>
    <ul class="update-log-list">
      <li><strong>October 20, 2026:</strong> Release of version 0.1.0.</li>
    </ul>
  </dialog>

  <script src="content/skins.js"></script>
  <script src="content/items.js"></script>
  <script src="content/effects.js"></script>
  <script src="content/build_mode.js"></script>
  <script src="script.js"></script>
</body>

</html>
